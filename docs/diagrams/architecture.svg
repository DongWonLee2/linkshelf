        <text x="812" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="-apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif" text-anchor="middle">GitHub Actions</text>
        <text x="812" y="383" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">./gradlew test · H2 mem</text>

