        <text x="120" y="223" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">curl · local</text>

        <!-- Backend (focal) -->
        <rect x="256" y="168" width="176" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="256" y="168" width="176" height="64" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
        <rect x="264" y="176" width="28" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
        <text x="278" y="185" fill="#eb6c36" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="344" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="-apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif" text-anchor="middle">linkshelf backend</text>
        <text x="344" y="223" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">Spring Boot 4.1.1 · Java 21</text>

        <!-- H2 file DB (store) -->
        <rect x="496" y="168" width="136" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="496" y="168" width="136" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="504" y="176" width="24" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="516" y="185" fill="#2d3142" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="564" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="-apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif" text-anchor="middle">H2 database</text>
        <text x="564" y="223" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">file · ./data/</text>

        <!-- Frontend (future, dashed) -->
        <rect x="48" y="328" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="48" y="328" width="144" height="64" rx="6" fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="56" y="336" width="36" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="74" y="345" fill="#7a8399" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">LATER</text>
        <text x="120" y="368" fill="#7a8399" font-size="12" font-weight="600" font-family="-apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif" text-anchor="middle">Frontend</text>
        <text x="120" y="383" fill="#7a8399" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">MVP-3 · not built</text>

        <!-- GitHub repo -->
        <rect x="712" y="168" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="712" y="168" width="200" height="64" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <rect x="720" y="176" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.22" stroke-width="0.8"/>
        <text x="736" y="185" fill="#7a8399" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">REPO</text>
        <text x="812" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="-apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif" text-anchor="middle">GitHub repo</text>
        <text x="812" y="223" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">DongWonLee2/linkshelf</text>

        <!-- GitHub Actions CI -->
        <rect x="712" y="328" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="712" y="328" width="200" height="64" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <rect x="720" y="336" width="24" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.22" stroke-width="0.8"/>
