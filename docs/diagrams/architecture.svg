        <rect x="112" y="526" width="20" height="14" rx="3" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
        <text x="140" y="536" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.08em">FOCAL</text>

        <rect x="208" y="526" width="20" height="14" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="236" y="536" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.08em">STORE</text>

        <rect x="304" y="526" width="20" height="14" rx="3" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <text x="332" y="536" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.08em">SERVICE</text>

        <rect x="412" y="526" width="20" height="14" rx="3" fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="440" y="536" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.08em">FUTURE (MVP-3)</text>

        <line x1="560" y1="533" x2="592" y2="533" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>
        <text x="600" y="536" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.08em">HTTP CALL</text>

        <line x1="680" y1="533" x2="712" y2="533" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#architecture-arrow-accent)"/>
