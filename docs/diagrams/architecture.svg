<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
        <title id="architecture-title">linkshelf 아키텍처 (현재 범위)</title>
        <desc id="architecture-desc">개발자가 로컬 Spring Boot 백엔드에 REST로 링크를 저장하고 백엔드는 H2 파일 DB에 JPA로 기록하며, 코드는 GitHub에 푸시되어 GitHub Actions가 테스트를 실행한다. 프론트엔드는 MVP-3 예정이라 점선이다.</desc>
        <defs>
      <style>#architecture-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      --font-serif:    'Iowan Old Style', Georgia, 'AppleMyungjo', serif;
      --font-mono:     ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      #architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture-root .source { margin-top: 1rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--color-muted);
      line-height: 1.6; }
      #architecture-root .diagram-container { overflow-x: visible; }</style>
          <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones -->
        <rect x="24" y="136" width="632" height="288" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <rect x="302" y="140" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="340" y="149" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">LOCAL MACHINE</text>

        <rect x="688" y="136" width="248" height="288" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <rect x="716" y="140" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="736" y="149" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">GITHUB</text>

        <!-- Arrows (drawn before nodes) -->
        <!-- Developer -> Backend : REST -->
        <line x1="192" y1="200" x2="256" y2="200" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>
        <!-- Backend -> H2 : JPA (headline path) -->
        <line x1="432" y1="200" x2="496" y2="200" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#architecture-arrow-accent)"/>
        <!-- Developer -> GitHub repo : git push (routed above zones) -->
        <path d="M 120,168 V 112 Q 120,104 128,104 H 804 Q 812,104 812,112 V 168" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <!-- GitHub repo -> Actions : PR / push trigger -->
        <line x1="812" y1="232" x2="812" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <!-- Frontend (future) -> Backend : dashed -->
        <path d="M 192,360 H 336 Q 344,360 344,352 V 232" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow)"/>

        <!-- Arrow labels -->
        <rect x="208" y="180" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="224" y="189" fill="#2e5aa8" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">REST</text>

        <rect x="452" y="180" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="464" y="189" fill="#eb6c36" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">JPA</text>

        <rect x="432" y="84" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="460" y="93" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">GIT PUSH</text>

        <rect x="824" y="274" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="856" y="283" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">PR · PUSH</text>

        <rect x="240" y="340" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="256" y="349" fill="#7a8399" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">REST</text>

        <!-- Nodes -->
        <!-- Developer (external/input) -->
        <rect x="48" y="168" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="48" y="168" width="144" height="64" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
        <rect x="56" y="176" width="28" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="70" y="185" fill="#7a8399" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
