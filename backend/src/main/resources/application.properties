spring.application.name=linkshelf

# ADR-0001: local H2 file database (git-ignored ./data/), schema generated by JPA for MVP only
spring.datasource.url=jdbc:h2:file:./data/linkshelf
spring.jpa.hibernate.ddl-auto=update
# Issue #5: keep the persistence context inside service transactions (no lazy loading in controllers/serialization)
spring.jpa.open-in-view=false
