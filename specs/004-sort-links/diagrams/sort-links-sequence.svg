<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="sort-links-sequence-title sort-links-sequence-desc" id="sort-links-sequence-root">
      <title id="sort-links-sequence-title">목록 정렬 시퀀스</title>
      <desc id="sort-links-sequence-desc">사용자가 오래된순을 고르면 화면이 order=oldest로 목록을 요청하고, 컨트롤러가 값을 검증한 뒤 저장소가 저장 시각 오름차순·id 오름차순으로 첫 쪽을 돌려주며, 링크 저장에 성공하면 화면이 정렬을 최신순으로 되돌려 다시 불러오는 흐름.</desc>
      <defs>
      <style>#sort-links-sequence-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      --font-serif:    'Iowan Old Style', Georgia, 'AppleMyungjo', serif;
      --font-mono:     ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      #sort-links-sequence-root { font-family: var(--font-sans); color: var(--color-ink); }
      #sort-links-sequence-root .diagram-container { width: 100%; overflow-x: auto; }
      #sort-links-sequence-root .diagram-container svg { display: block; min-width: 1200px; width: 100%; height: auto; }
      #sort-links-sequence-root .source { margin-top: 1rem;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--color-muted);
      line-height: 1.6; }
      #sort-links-sequence-root .t-name { font-family: var(--font-sans); font-size: 13px; font-weight: 600; fill: #2d3142; }
      #sort-links-sequence-root .t-sub { font-family: var(--font-mono); font-size: 9px; fill: #4f5d75; }
      #sort-links-sequence-root .t-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; fill: #4f5d75; }
      #sort-links-sequence-root .t-label-accent { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; fill: #eb6c36; font-weight: 600; }
      #sort-links-sequence-root .t-guard { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.04em; fill: #4f5d75; }
      #sort-links-sequence-root .t-note { font-family: var(--font-serif); font-style: italic; font-size: 13px; fill: #2d3142; }
      #sort-links-sequence-root .t-note-num { font-family: var(--font-mono); font-size: 10px; font-weight: 600; fill: #4f5d75; }
      #sort-links-sequence-root .t-legend { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; fill: #4f5d75; }</style>
        <marker id="sort-links-sequence-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="sort-links-sequence-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="1200" height="700" fill="#f5f5f5"/>

      <!-- ===== Lifelines (x = 100, 292, 484, 676, 868) ===== -->
      <g stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3">
        <line x1="100" y1="88" x2="100" y2="612"/>
        <line x1="292" y1="88" x2="292" y2="612"/>
        <line x1="484" y1="88" x2="484" y2="612"/>
        <line x1="676" y1="88" x2="676" y2="612"/>
        <line x1="868" y1="88" x2="868" y2="612"/>
      </g>

      <!-- ===== ALT fragment (drawn under messages) ===== -->
      <rect x="76" y="404" width="816" height="184" rx="4" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1"/>
      <rect x="76" y="404" width="40" height="16" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1"/>
      <text x="96" y="416" class="t-guard" text-anchor="middle" letter-spacing="0.12em">ALT</text>
      <text x="128" y="416" class="t-guard">[저장 성공 · R-UI-20]</text>

      <!-- ===== Activation bars ===== -->
      <g fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8">
        <rect x="288" y="128" width="8" height="240"/>
        <rect x="480" y="168" width="8" height="192"/>
        <rect x="672" y="256" width="8" height="72"/>
        <rect x="864" y="288" width="8" height="32"/>
        <rect x="288" y="440" width="8" height="128"/>
        <rect x="480" y="528" width="8" height="40"/>
      </g>

      <!-- ===== Messages (arrows first, then label masks + text) ===== -->
      <!-- m1 select oldest -->
      <line x1="100" y1="128" x2="286" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sort-links-sequence-arrow)"/>
      <!-- m2 GET order=oldest (focal) -->
      <line x1="296" y1="168" x2="478" y2="168" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#sort-links-sequence-arrow-accent)"/>
      <!-- m3 VALIDATE (self) -->
      <path d="M 488 200 H 516 Q 524 200 524 208 V 212 Q 524 220 516 220 H 490" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sort-links-sequence-arrow)"/>
      <!-- m4 list(OLDEST) -->
      <line x1="488" y1="256" x2="670" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sort-links-sequence-arrow)"/>
      <!-- m5 sort asc -->
      <line x1="680" y1="288" x2="862" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sort-links-sequence-arrow)"/>
      <!-- m6 page (return) -->
      <line x1="864" y1="320" x2="682" y2="320" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#sort-links-sequence-arrow)"/>
      <!-- m7 200 page (return) -->
      <line x1="480" y1="352" x2="298" y2="352" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#sort-links-sequence-arrow)"/>
      <!-- s1 save -->
      <line x1="100" y1="440" x2="286" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sort-links-sequence-arrow)"/>
      <!-- s2 reset to newest (self, focal) -->
      <path d="M 296 472 H 324 Q 332 472 332 480 V 484 Q 332 492 324 492 H 298" fill="none" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#sort-links-sequence-arrow-accent)"/>
      <!-- s3 GET order=newest -->
      <line x1="296" y1="528" x2="478" y2="528" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sort-links-sequence-arrow)"/>
      <!-- s4 200 page (return) -->
      <line x1="480" y1="560" x2="298" y2="560" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#sort-links-sequence-arrow)"/>

      <!-- Label masks (opaque) + labels: centered on segment, 8px above stroke -->
      <rect x="144" y="106" width="100" height="14" fill="#f5f5f5"/>
      <text x="194" y="117" class="t-label" text-anchor="middle">SELECT OLDEST</text>

      <rect x="341" y="146" width="92" height="14" fill="#f5f5f5"/>
      <text x="387" y="157" class="t-label-accent" text-anchor="middle">ORDER=OLDEST</text>

      <rect x="532" y="203" width="96" height="14" fill="#f5f5f5"/>
      <text x="536" y="214" class="t-label">VALIDATE [1]</text>

      <rect x="533" y="234" width="92" height="14" fill="#f5f5f5"/>
      <text x="579" y="245" class="t-label" text-anchor="middle">LIST(OLDEST)</text>

      <rect x="725" y="266" width="92" height="14" fill="#f5f5f5"/>
      <text x="771" y="277" class="t-label" text-anchor="middle">SORT ASC [2]</text>

      <rect x="749" y="298" width="48" height="14" fill="#f5f5f5"/>
      <text x="773" y="309" class="t-label" text-anchor="middle">PAGE</text>

      <rect x="353" y="330" width="72" height="14" fill="#f5f5f5"/>
      <text x="389" y="341" class="t-label" text-anchor="middle">200 PAGE</text>

      <rect x="169" y="418" width="48" height="14" fill="#f5f5f5"/>
      <text x="193" y="429" class="t-label" text-anchor="middle">SAVE</text>

      <rect x="340" y="475" width="80" height="14" fill="#f5f5f5"/>
      <text x="344" y="486" class="t-label-accent">NEWEST [3]</text>

      <rect x="341" y="506" width="92" height="14" fill="#f5f5f5"/>
      <text x="387" y="517" class="t-label" text-anchor="middle">ORDER=NEWEST</text>

      <rect x="353" y="538" width="72" height="14" fill="#f5f5f5"/>
      <text x="389" y="549" class="t-label" text-anchor="middle">200 PAGE</text>

      <!-- ===== Actor boxes (drawn last so lifelines sit behind) ===== -->
      <!-- 사용자 (input) -->
      <rect x="32" y="40" width="136" height="48" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#8a93a6" stroke-width="1"/>
      <text x="100" y="62" class="t-name" text-anchor="middle">사용자</text>
      <text x="100" y="77" class="t-sub" text-anchor="middle">브라우저</text>
      <!-- 화면 (frontend) -->
      <rect x="224" y="40" width="136" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="292" y="62" class="t-name" text-anchor="middle">화면 App</text>
      <text x="292" y="77" class="t-sub" text-anchor="middle">link-sort-select</text>
      <!-- LinkController -->
      <rect x="416" y="40" width="136" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="484" y="62" class="t-name" text-anchor="middle">LinkController</text>
      <text x="484" y="77" class="t-sub" text-anchor="middle">@Pattern order</text>
      <!-- LinkService -->
      <rect x="608" y="40" width="136" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="676" y="62" class="t-name" text-anchor="middle">LinkService</text>
      <text x="676" y="77" class="t-sub" text-anchor="middle">LinkOrder</text>
      <!-- LinkRepository -->
      <rect x="796" y="40" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="868" y="62" class="t-name" text-anchor="middle">LinkRepository</text>
      <text x="868" y="77" class="t-sub" text-anchor="middle">OLDEST_FIRST</text>

      <!-- ===== Notes (right column, no leaders; numbers match labels) ===== -->
      <text x="924" y="172" class="t-note-num">[1]</text>
      <text x="952" y="172" class="t-note">newest·oldest가 아니면(빈 값</text>
      <text x="952" y="190" class="t-note">포함) → 400, errors[]에</text>
      <text x="952" y="208" class="t-note">field=order. page·size 오류와</text>
      <text x="952" y="226" class="t-note">함께 담는다(R-LINK-21).</text>

      <text x="924" y="276" class="t-note-num">[2]</text>
      <text x="952" y="276" class="t-note">createdAt asc, id asc.</text>
      <text x="952" y="294" class="t-note">생략·newest면 desc, desc</text>
      <text x="952" y="312" class="t-note">(R-LINK-09, 19). 태그로 거른</text>
      <text x="952" y="330" class="t-note">뒤 정렬한다(R-LINK-20).</text>

      <text x="924" y="476" class="t-note-num">[3]</text>
      <text x="952" y="476" class="t-note">필터 해제와 함께 정렬을</text>
      <text x="952" y="494" class="t-note">최신순으로 되돌려 새 링크가</text>
      <text x="952" y="512" class="t-note">첫 쪽 맨 위에 보인다.</text>

      <!-- ===== Legend strip ===== -->
      <line x1="32" y1="636" x2="1168" y2="636" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
      <line x1="32" y1="664" x2="64" y2="664" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sort-links-sequence-arrow)"/>
      <text x="72" y="667" class="t-legend">호출</text>
      <line x1="136" y1="664" x2="168" y2="664" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#sort-links-sequence-arrow)"/>
      <text x="176" y="667" class="t-legend">반환</text>
      <line x1="232" y1="664" x2="264" y2="664" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#sort-links-sequence-arrow-accent)"/>
      <text x="272" y="667" class="t-legend">이 기능이 바꾼 경로</text>
      <rect x="432" y="656" width="24" height="16" rx="2" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1"/>
      <text x="464" y="667" class="t-legend">ALT 분기</text>
      <rect x="536" y="656" width="8" height="16" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="552" y="667" class="t-legend">처리 중(activation)</text>
    </svg>
