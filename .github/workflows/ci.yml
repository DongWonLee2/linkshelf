name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate changed Playwright snapshots and upload them as an artifact (spec 003 research R1)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test
        run: |
          set -euo pipefail
          ./gradlew test --console=plain

  # spec 003 / ADR-0005: frontend E2E against the backend on an in-memory H2. Pinned runner image so visual
  # baselines (*-chromium-linux.png) are made and compared on the same OS (research R1).
  frontend-e2e:
    name: frontend-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Compile backend
        working-directory: backend
        run: ./gradlew classes --console=plain
      - name: E2E
        env:
          UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots }}
        run: |
          set -euo pipefail
          if [ "${UPDATE_SNAPSHOTS:-false}" = "true" ]; then
            npx playwright test --update-snapshots=changed
          else
            npx playwright test
          fi
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload snapshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-snapshots
          path: frontend/e2e/**/*-snapshots/**
          retention-days: 7
          if-no-files-found: ignore
